name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Load the built site in headless Chrome (docs/FEATURES.md)
        run: node scripts/verify.mjs
      - name: Real keys, clicks and hover in headless Chrome
        run: node scripts/keys.mjs
