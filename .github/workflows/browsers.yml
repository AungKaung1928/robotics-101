name: Browsers

# Smoke tests on Chromium, Firefox and WebKit (desktop, Pixel, iPhone, iPad emulation): e2e/smoke/smoke.pw.mjs.
# Emulation only: a real iPhone, iPad, Mac and Android phone are checked by hand (BROWSER_COVERAGE.md).
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Not in package.json: only this job needs it. Pinned (npm view @playwright/test version, 2026-11-24).
      - run: npm install --no-save @playwright/test@1.65.1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run build
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
